packages:
  - 'packages/*'
  - 'codemods/*'
  - 'demos'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.6bc2d240a024170c08fbc831f0c201c162afd22e
  vite-plus: 0.0.0-commit.6bc2d240a024170c08fbc831f0c201c162afd22e
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  iframe-resizer: true
minimumReleaseAgeExclude:
  # ecosystem-ci smoke test: preview builds and freshly pinned toolchain packages
  - vite-plus
  - '@voidzero-dev/*'
  - '@oxc-project/*'
  - oxlint
  - '@oxlint/*'
  - oxfmt
  - '@oxfmt/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - vitest
  - '@vitest/*'
  - tinybench
  - yuku-core
  - yuku-parser
  - '@yuku-core/*'
  - '@yuku-toolchain/*'
  - '@tiptap/*'
  - prosemirror-history@1.5.1
overrides:
  '@rollup/pluginutils>picomatch': '2.3.2'
  'prosemirror-model': '^1.25.12'
  'prosemirror-view': '^1.42.6'
  'anymatch>picomatch': '2.3.2'
  'brace-expansion@>=2 <3': '2.1.7'
  'fast-uri@>=3 <4': '3.1.8'
  'follow-redirects': '1.16.1'
  'glob': '^10.5.0'
  'js-yaml@>=4 <5': '4.3.2'
  'micromatch>picomatch': '2.3.2'
  'minimatch@^3.0.5': '3.1.4'
  'minimatch@^3.1.2': '3.1.4'
  'postcss-selector-parser@>=6 <8': '7.1.7'
  'qs': '^6.16.1'
  'readdirp>picomatch': '2.3.2'
  'sass>immutable': '5.1.9'
  'source-map-js@>=1.2.0 <2': '1.2.2'
  'tinyglobby>picomatch': '4.0.4'
  'vitest>picomatch': '4.0.4'
  vite@*: 'catalog:'
peerDependencyRules:
  allowedVersions:
    vite: '*'
  allowAny:
    - vite
